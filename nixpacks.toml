# Legacy Nixpacks plan. No service should build from this file:
# daily-brief uses railway.toml and chat uses railway.chat.toml (both Railpack).
# It remains only because libri-worker, which has no config file selected,
# still picks it up. Delete it once libri-worker selects /railway.libri.toml.
# nodejs_22 here resolves to 22.19.0 (nixpkgs 23f9169c), below the
# CVE-2026-111497 floor of 22.23.4.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
dependsOn = ["setup"]
cmds = ["npx --yes pnpm@11.7.0 install --prod=false --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["NODE_OPTIONS=--max-old-space-size=2048 npx --yes pnpm@11.7.0 exec turbo build --filter=@buildos/worker"]

[start]
cmd = "node apps/worker/dist/index.js"
