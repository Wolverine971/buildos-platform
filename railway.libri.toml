# Railway configuration for the dedicated Libri worker service.
# The service must explicitly select /railway.libri.toml so neither the
# general worker nor Agentic Chat entrypoint can be started accidentally.
[build]
builder = "RAILPACK"
buildCommand = "NODE_OPTIONS=--max-old-space-size=2048 npx --yes pnpm@11.7.0 exec turbo build --filter=@buildos/worker"
watchPatterns = [
  "apps/worker/**",
  "packages/**",
  "patches/**",
  "turbo.json",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "railway.libri.toml"
]

[deploy]
startCommand = "node apps/worker/dist/libri-worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300

[variables]
NODE_ENV = "production"
LIBRI_WORKER_PROFILE = "production"
LIBRI_WORKER_ENABLED = "false"
LIBRI_WORKER_CONCURRENCY = "2"
