# Railway configuration for the dedicated Libri worker service.
# The libri-worker service must explicitly select this file as
# /railway.libri.toml. Without a config file it was built by Nixpacks from the
# root nixpacks.toml (old nixpkgs, Node 22.19.0) even though its service
# setting says Railpack.
[build]
# Railpack resolves Node from the root package.json engines (latest patched
# 22.x) and passes Railway variables to build steps as BuildKit secrets.
builder = "RAILPACK"
buildCommand = "NODE_OPTIONS=--max-old-space-size=2048 npx --yes pnpm@11.7.0 exec turbo build --filter=@buildos/worker"
watchPatterns = [
  "apps/worker/**",
  "packages/**",
  "patches/**",
  "turbo.json",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "railway.libri.toml"
]

[deploy]
# Mirrors the service settings in use on 2026-10-22.
startCommand = "node apps/worker/dist/libri-worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300
drainingSeconds = 30

[variables]
NODE_ENV = "production"
