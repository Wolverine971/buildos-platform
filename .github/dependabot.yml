version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '10:00'
          timezone: America/New_York
      versioning-strategy: increase-if-necessary
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - patch
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
          # sanitize-html >=2.17.6 pulls htmlparser2 12, which is ESM-only and
          # crashes the CommonJS Vercel server bundle at runtime.
          - dependency-name: sanitize-html
            versions:
                - '>=2.17.6'
