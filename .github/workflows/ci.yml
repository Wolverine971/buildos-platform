# .github/workflows/ci.yml
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: '17 11 * * *'

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck, lint, test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Reads the pnpm version from the packageManager field in package.json
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # GitHub's runner installs PostgreSQL outside PATH. Add it before
            # `verify` so every disposable .postgres.test.ts suite actually
            # runs instead of taking its intentional local skip path.
            - name: Add PostgreSQL tools to PATH
              run: |
                  PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
                  test -n "$PG_BIN" || { echo "::error::no postgres binaries on runner"; exit 1; }
                  echo "$PG_BIN" >> "$GITHUB_PATH"

            # SvelteKit $env/static modules need values present at build/test time.
            # CI has no real secrets; the example files provide placeholder values.
            - name: Provide placeholder env
              run: |
                  cp .env.example .env
                  cp apps/web/.env.example apps/web/.env
                  cp apps/worker/.env.example apps/worker/.env

            - name: Verify repository contract
              env:
                  MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: pnpm verify

            - name: Test coverage
              run: pnpm turbo test:coverage

            # Disposable-PostgreSQL suite proving the deep-research DB guarantees
            # (budget races, privilege fences, synthesis wakeup). Runner images
            # ship postgres binaries outside PATH; the suite skips gracefully if
            # none are found, so surface the bin dir explicitly.
            - name: Deep-research DB integration tests
              run: pnpm --filter @buildos/worker test:deep-research:integration

            - name: Self-contained Supabase SQL contracts
              run: pnpm test:sql-contracts

            - name: Upload coverage artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-reports
                  path: |
                      apps/web/coverage/**
                      apps/worker/coverage/**
                      packages/*/coverage/**
                  if-no-files-found: warn
                  retention-days: 14

    supabase-schema-drift:
        name: Supabase RPC schema drift
        # Production is migrated after code review/merge, so comparing a schema-
        # changing PR to pre-deploy production would be a guaranteed false alarm.
        # Run on the trusted post-deploy/manual and daily audit paths instead.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Compare live and generated RPC names
              env:
                  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
                  PRIVATE_SUPABASE_SERVICE_KEY: ${{ secrets.PRIVATE_SUPABASE_SERVICE_KEY }}
              run: node scripts/security/check-supabase-rpc-drift.mjs
