# .github/workflows/ci.yml
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: '17 11 * * *'

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck, lint, test
        needs: current-schema-contracts
        if: always()
        runs-on: ubuntu-latest
        # The full repository and coverage suites run close to 30 minutes;
        # retain headroom so the dependent Libri safety gate gets a verdict.
        timeout-minutes: 45
        steps:
            - name: Require current-schema SQL contracts
              run: test "${{ needs.current-schema-contracts.result }}" = "success"

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Reads the pnpm version from the packageManager field in package.json
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # GitHub's runner installs PostgreSQL outside PATH. Add it before
            # `verify` so every disposable .postgres.test.ts suite actually
            # runs instead of taking its intentional local skip path.
            - name: Add PostgreSQL tools to PATH
              run: |
                  PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
                  test -n "$PG_BIN" || { echo "::error::no postgres binaries on runner"; exit 1; }
                  echo "$PG_BIN" >> "$GITHUB_PATH"

            # SvelteKit $env/static modules need values present at build/test time.
            # CI has no real secrets; the example files provide placeholder values.
            - name: Provide placeholder env
              run: |
                  cp .env.example .env
                  cp apps/web/.env.example apps/web/.env
                  cp apps/worker/.env.example apps/worker/.env

            - name: Verify repository contract with one coverage run
              env:
                  MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: pnpm verify:ci

            # Disposable-PostgreSQL coverage for Agent Run cost reservations,
            # privilege fences, and stranded proposal commit recovery.
            - name: Agent Run DB integration tests
              run: pnpm --filter @buildos/worker test:agent-run:integration

            - name: Self-contained Supabase SQL contracts
              run: pnpm test:sql-contracts

            - name: Upload coverage artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-reports
                  path: |
                      apps/web/coverage/**
                      apps/worker/coverage/**
                      packages/*/coverage/**
                  if-no-files-found: warn
                  retention-days: 14

    current-schema-contracts:
        name: Current schema SQL contracts (PostgreSQL 15)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: pgvector/pgvector:0.8.7-pg15
                env:
                    POSTGRES_PASSWORD: postgres
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        steps:
            - uses: actions/checkout@v4
            - name: Add PostgreSQL tools to PATH
              run: |
                  PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
                  test -n "$PG_BIN" || { echo "::error::no postgres binaries on runner"; exit 1; }
                  echo "$PG_BIN" >> "$GITHUB_PATH"
            - name: Run every current-schema assertion
              env:
                  BUILDOS_EXPECTED_POSTGRES_MAJOR: '15'
                  BUILDOS_CURRENT_SCHEMA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
              run: python3 scripts/database/current_schema.py

    libri-migration-safety:
        name: Libri migration safety
        needs: checks
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: postgres
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        steps:
            - name: Require the full BuildOS verification job
              run: test "${{ needs.checks.result }}" = "success"

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Add PostgreSQL tools to PATH
              run: |
                  PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
                  test -n "$PG_BIN" || { echo "::error::no postgres binaries on runner"; exit 1; }
                  echo "$PG_BIN" >> "$GITHUB_PATH"

            - name: Run the Libri static and PostgreSQL 15 contract gate
              env:
                  BUILDOS_EXPECTED_POSTGRES_MAJOR: '15'
                  BUILDOS_SQL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
                  MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: pnpm verify:libri-migrations

    supabase-schema-drift:
        name: Supabase RPC schema drift
        # Production is migrated after code review/merge, so comparing a schema-
        # changing PR to pre-deploy production would be a guaranteed false alarm.
        # Run on the trusted post-deploy/manual and daily audit paths instead.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Test generated RPC parser
              run: node --test scripts/security/check-supabase-rpc-drift.test.mjs

            - name: Compare live and generated RPC names
              env:
                  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
                  PRIVATE_SUPABASE_SERVICE_KEY: ${{ secrets.PRIVATE_SUPABASE_SERVICE_KEY }}
              run: node scripts/security/check-supabase-rpc-drift.mjs
