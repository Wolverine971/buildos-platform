# Railway configuration for the dedicated Agentic Chat worker service.
# The agentic-chat-worker service must explicitly select this file as
# /railway.chat.toml so the repo-root general-worker config cannot override
# the isolated entrypoint.
[build]
# Railpack passes Railway variables to build steps as BuildKit secrets instead
# of baking secret-bearing ARG/ENV instructions into a generated Dockerfile.
builder = "RAILPACK"
buildCommand = "NODE_OPTIONS=--max-old-space-size=2048 npx --yes pnpm@11.7.0 exec turbo build --filter=@buildos/worker"
watchPatterns = [
  "apps/worker/**",
  "packages/**",
  "patches/**",
  "turbo.json",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "railway.chat.toml"
]

[deploy]
startCommand = "node apps/worker/dist/chat-worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300

[variables]
NODE_ENV = "production"
