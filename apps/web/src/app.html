<!-- apps/web/src/app.html -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>

		<link rel="icon" type="image/png" sizes="32x32" href="/AppImages/ios/32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/AppImages/ios/16.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/AppImages/ios/180.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="/AppImages/android/android-launchericon-192-192.png"
		/>
		<meta name="apple-mobile-web-app-title" content="BuildOS" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Additional iOS icon sizes -->
		<link rel="apple-touch-icon" sizes="120x120" href="/AppImages/ios/120.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/AppImages/ios/152.png" />
		<link rel="apple-touch-icon" sizes="167x167" href="/AppImages/ios/167.png" />

		<!-- Android Chrome icons -->
		<link
			rel="icon"
			type="image/png"
			sizes="144x144"
			href="/AppImages/android/android-launchericon-144-144.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"
			href="/AppImages/android/android-launchericon-512-512.png"
		/>

		<!-- Enhanced iOS/Safari support -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Theme colors for light/dark mode -->
		<meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1d1c1b" media="(prefers-color-scheme: dark)" />

		<!-- Default theme color for iOS status bar -->
		<meta name="theme-color" content="#fbfaf9" />

		<!-- iOS splash screens (optional but recommended) -->
		<meta name="apple-touch-fullscreen" content="yes" />

		<!--
			Recover before the application hooks load. Keep Vite's preload event
			uncanceled so the original import failure reaches SvelteKit; canceling it
			turns the missing route module into an unhelpful `undefined.universal` error.
		-->
		<script>
			(() => {
				const recoveryKey = 'buildos:route-load-recovery';
				const reloadCooldownMs = 60_000;

				window.addEventListener('vite:preloadError', (event) => {
					const reloadAt = Date.now();
					const route = `${window.location.pathname}${window.location.search}`;
					let previousAttempt = null;

					try {
						const serialized = window.sessionStorage.getItem(recoveryKey);
						previousAttempt = serialized ? JSON.parse(serialized) : null;
					} catch {
						previousAttempt = null;
					}

					if (
						previousAttempt?.route === route &&
						reloadAt >= previousAttempt.attemptedAt &&
						reloadAt - previousAttempt.attemptedAt < reloadCooldownMs
					) {
						return;
					}

					const payload = event.payload;
					const message =
						payload && typeof payload.message === 'string' ? payload.message : '';
					const dynamicImportMatch = message.match(
						/(?:Failed to fetch|Error loading) dynamically imported module:\s*(\S+)/i
					);
					const immutableAssetMatch = message.match(
						/https?:\/\/\S+\/_app\/immutable\/\S+\.js/i
					);
					const moduleUrl = dynamicImportMatch?.[1] ?? immutableAssetMatch?.[0] ?? null;

					try {
						window.sessionStorage.setItem(
							recoveryKey,
							JSON.stringify({ route, attemptedAt: reloadAt, moduleUrl })
						);
					} catch {
						// Without a persisted guard, reloading could create a loop.
						return;
					}

					window.location.reload();
				});
			})();
		</script>

		%sveltekit.head%
	</head>

	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
